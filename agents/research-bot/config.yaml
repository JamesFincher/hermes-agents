# Cited knobs only. Playbook: docs/PROFILE-PLAYBOOK.md
#
# memory.provider:
#   https://hermes-agent.nousresearch.com/docs/user-guide/features/memory-providers
# custom_toolsets + toolsets:
#   https://hermes-agent.nousresearch.com/docs/reference/toolsets-reference
# plugins.enabled / disabled / entries / mcp_allowlist:
#   https://hermes-agent.nousresearch.com/docs/user-guide/features/plugins
# mcp_servers + ${env:VAR}:
#   https://hermes-agent.nousresearch.com/docs/reference/mcp-config-reference
# web.search_backend / web.extract_backend / web.keyless_fallback /
# web.keyless_rescue:
#   https://hermes-agent.nousresearch.com/docs/user-guide/features/web-search
#   https://hermes-agent.nousresearch.com/docs/developer-guide/web-search-provider-plugin
#   https://hermes-agent.nousresearch.com/docs/user-guide/configuration

memory:
  provider: honcho
  memory_enabled: true
  user_profile_enabled: true

terminal:
  backend: local
  cwd: "."

# Cited from official web-search + configuration docs.
# Deploy-host env (never commit): SEARXNG_URL, FIRECRAWL_API_URL.
web:
  search_backend: "searxng"
  extract_backend: "firecrawl"
  keyless_fallback: false
  keyless_rescue: false

custom_toolsets:
  research:
    - web
    - terminal
    - file
    - skills
    - memory
    - session_search
    - research-bot

toolsets:
  - research

plugins:
  enabled:
    - research-bot
  entries:
    research-bot:
      mcp_allowlist:
        - context7
      settings:
        citation_style: apa

mcp_servers:
  context7:
    url: "https://mcp.context7.com/mcp"
    headers:
      CONTEXT7_API_KEY: "${env:CONTEXT7_API_KEY}"
    tools:
      resources: true
      prompts: true
