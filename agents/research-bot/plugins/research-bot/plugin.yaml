# Native plugin manifest. Official fields:
# https://hermes-agent.nousresearch.com/docs/developer-guide/plugins
# name, version, description, provides_tools, provides_hooks,
# config_schema (v2: keys under plugins.entries.<id>.settings)

name: research-bot
version: 0.1.0
manifest_version: 2
api_version: 1
description: "Research execution layer — source ledger, citation, and write policy for the research-bot profile."
author: James Fincher
license: Apache-2.0
tags: [research, citations, ledger]
provides_tools:
  - source_ledger_add
  - source_ledger_list
  - source_ledger_cite
  - source_ledger_check
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
config_schema:
  citation_style:
    type: str
    default: apa
    description: "Citation format for source_ledger_cite: apa, ieee, or chicago."
    required: false
  strictness:
    type: str
    default: strict
    description: "Write policy. strict blocks product-code writes; relaxed allows them."
    required: false
