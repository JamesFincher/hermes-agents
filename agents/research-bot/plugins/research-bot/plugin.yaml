# Native general plugin (plugin.yaml + register(ctx)). Not portable plugin.json.
# Not a memory-provider (kind: exclusive / memory.provider).
# https://hermes-agent.nousresearch.com/docs/developer-guide/plugins

name: research-bot
version: 0.2.0
manifest_version: 2
api_version: 1
description: "Host package that registers resolve_library, docs_query, and source-ledger tools (toolset research-bot)."
author: James Fincher
license: Apache-2.0
tags: [research, context7, ledger, citations]
provides_tools:
  - resolve_library
  - docs_query
  - source_ledger_add
  - source_ledger_list
  - cite_source
  - source_ledger_check
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
config_schema:
  citation_style:
    type: str
    default: apa
    description: "Citation format for cite_source: apa, ieee, or chicago."
    required: false
