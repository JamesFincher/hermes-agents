# Manifest keys from official profile-distributions + profile-commands docs.
# https://hermes-agent.nousresearch.com/docs/user-guide/profile-distributions
# https://hermes-agent.nousresearch.com/docs/reference/profile-commands
#
# hermes_requires: official examples use ">=0.12.0" / ">=0.13.0". Floor is
# 0.12.0 because that is the documented example for a research-bot
# distribution (same page). Current tagged Hermes at time of writing: 0.20.6.

name: research-bot
version: 0.1.0
description: "Reads source + external docs + papers, writes cited findings, does not implement product code."
hermes_requires: ">=0.12.0"
author: "James Fincher"
license: "Apache-2.0"

# Official DEFAULT_DIST_OWNED is SOUL.md, config.yaml, mcp.json, skills/,
# cron/, distribution.yaml. plugins/ is NOT in that default. Claim it so
# updates replace process code. Setting this list replaces the default —
# include the defaults we still want plus plugins and the other files we ship.
# https://hermes-agent.nousresearch.com/docs/user-guide/profile-distributions
distribution_owned:
  - SOUL.md
  - config.yaml
  - mcp.json
  - skills
  - plugins
  - distribution.yaml
  - profile.yaml
  - honcho.json.example
  - README.md
  - .gitignore

env_requires:
  - name: HONCHO_API_KEY
    description: "Honcho Cloud API key (app.honcho.dev). Needed for Honcho Cloud. Self-hosted Honcho uses honcho.json baseUrl instead and can leave this unset."
    required: false
  - name: CONTEXT7_API_KEY
    description: "Context7 API key for the remote MCP server. Interpolated as ${env:CONTEXT7_API_KEY} in mcp.json / config.yaml. Optional; without it Context7 MCP will not authenticate."
    required: false
  - name: OPENAI_API_KEY
    description: "Example model-provider key. This distribution does not pin a model or provider — use whichever provider key your Hermes setup already requires (OpenAI, Anthropic, Nous Portal, OpenRouter, …)."
    required: false
