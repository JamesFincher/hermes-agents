# Manifest keys from official profile-distributions + profile-commands.
# https://hermes-agent.nousresearch.com/docs/user-guide/profile-distributions
# hermes_requires: official examples are ">=0.12.0" / ">=0.13.0".
# 0.14.0 was [UNV] and is removed (docs/HERMES-FACTS.md).

name: research-bot
version: 2.0.0
description: "Plans, fans out, verifies, and writes cited research briefs. Does not write product code."
hermes_requires: ">=0.13.0"
author: "James Fincher"
license: "Apache-2.0"

# Official DEFAULT_DIST_OWNED does not include plugins/. Setting this list
# replaces the default — keep the defaults we still want plus plugins.
distribution_owned:
  - SOUL.md
  - config.yaml
  - mcp.json
  - skills
  - plugins
  - distribution.yaml
  - profile.yaml
  - honcho.json.example
  - .env.EXAMPLE
  - README.md
  - .gitignore

env_requires:
  - name: HONCHO_API_KEY
    description: "Honcho Cloud API key (app.honcho.dev). Self-hosted Honcho uses honcho.json baseUrl instead."
    required: false
  - name: CONTEXT7_API_KEY
    description: "Context7 API key for the remote MCP server. Interpolated as ${env:CONTEXT7_API_KEY}."
    required: false
  - name: SEARXNG_URL
    description: "Deploy-host URL for web.search_backend: searxng. Self-hosted search. Never commit the value."
    required: false
  - name: FIRECRAWL_API_URL
    description: "Deploy-host URL for web.extract_backend: firecrawl. Self-hosted extract. Key optional when this URL is set. Never commit the value."
    required: false
  - name: OPENAI_API_KEY
    description: "Example model-provider key. This distribution does not pin a model."
    required: false
  - name: HERMES_CDP_URL
    description: "Optional CDP endpoint for browser.cdp_url. Host env, not a Hermes-defined name."
    required: false
  - name: UNPAYWALL_EMAIL
    description: "Polite pool email for Unpaywall HTTP fallback (literature-sweep scripts)."
    required: false
  - name: CROSSREF_MAILTO
    description: "Polite pool email for Crossref HTTP fallback."
    required: false
  - name: SEMANTIC_SCHOLAR_API_KEY
    description: "Optional Semantic Scholar key for scholar_search HTTP fallback."
    required: false
