# Cited knobs only. Sweep: docs/profiles/inception-spec.md
# Official: https://hermes-agent.nousresearch.com/docs/user-guide/configuration
#
# Do not invent model ids. The operator sets model.default on the host.

# Fan-out rejected for this profile. Keys kept explicit so defaults are written.
delegation:
  max_concurrent_children: 1
  max_iterations: 20
  max_spawn_depth: 1
  orchestrator_enabled: false
  child_timeout_seconds: 0
  worktree_isolation: false
  surface_child_process_notifications: false

auxiliary:
  compression:
    reasoning_effort: "low"
    max_concurrency: 1
  title_generation:
    enabled: false
  review: {}

# Mandatory context-economics block (playbook §5).
compression:
  enabled: true
  threshold: 0.55
  threshold_tokens: 120000
  tail_mode: lean
  protect_last_n: 12
  protect_first_n: 2
  in_place: true
  idle_compact_after_seconds: 1800
  proactive_prune_tokens: 32000
  proactive_prune_min_result_chars: 4000
  proactive_prune_min_reclaim_tokens: 4096

tool_output:
  max_bytes: 40000
  max_lines: 800
  max_line_length: 1200

tool_budget:
  mcp_result_size_chars: 30000

file_read_max_chars: 100000
context_file_max_chars: 20000

prompt_caching:
  cache_ttl: "1h"

agent:
  max_turns: none
  run_budget_seconds: 1800
  api_max_retries: 2
  session_stall_timeout: 300
  verify_on_stop: false
  coding_instructions: ""

# Local so scaffold writes land in the library checkout. [INF]
terminal:
  backend: local
  timeout: 180
  env_passthrough: []

# Locked gather. Official web-search + configuration pages.
# Degrade, do not die.
web:
  search_backend: "searxng"
  extract_backend: "firecrawl"
  keyless_fallback: true
  keyless_rescue: true

skills:
  inline_shell: false
  write_approval: false
  guard_agent_created: true

memory:
  provider: honcho
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 1200
  user_char_limit: 800
  write_approval: false

# Official: every tool belongs to one toolset. No moa toolset.
# https://hermes-agent.nousresearch.com/docs/reference/toolsets-reference
custom_toolsets:
  factory:
    - web
    - file
    - terminal
    - skills
    - memory
    - session_search
    - todo
    - clarify
    - inception

toolsets:
  - factory

plugins:
  enabled:
    - inception
  stream_reasoning_deltas: false
  entries:
    inception:
      mcp_allowlist:
        - context7

mcp_servers:
  context7:
    url: "https://mcp.context7.com/mcp"
    headers:
      CONTEXT7_API_KEY: "${env:CONTEXT7_API_KEY}"
    tools:
      resources: true
      prompts: true
